[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skincalc"
version = "0.1.0"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "sqlalchemy==2.0.27",
    "psycopg2-binary==2.9.9",
    "httpx==0.27.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.1.0",
    "python-dotenv==1.0.1",
    "pydantic==2.6.3",
    "pydantic-settings==2.2.1",
    "pytest",
    "h2",
    "brotli"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]